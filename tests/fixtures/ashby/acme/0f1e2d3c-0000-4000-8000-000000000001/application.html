<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Software Engineering Intern @ Acme</title></head>
<body>
<!-- Synthetic Ashby application form (fabricated employer). Structure copied from a live jobs.ashbyhq.com form on 2026-10-16. -->
<main>
  <h1>Software Engineering Intern</h1>
  <h2>Autofill from resume</h2>
  <div class="ashby-application-form-autofill-input-root"><input type="file" aria-label="Autofill from resume"><button type="submit">Upload file</button></div>

  <div class="ashby-application-form-container">
    <h2>Application Form</h2>
    <div class="ashby-application-form-field-entry" data-field-path="_systemfield_name">
      <label class="ashby-application-form-question-title" for="_systemfield_name">Name</label>
      <div><input placeholder="Type here..." name="_systemfield_name" required id="_systemfield_name" type="text" class="ashby-application-form-input-text" value=""></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="_systemfield_email">
      <label class="ashby-application-form-question-title" for="_systemfield_email">Email</label>
      <div><input name="_systemfield_email" required id="_systemfield_email" type="email" class="ashby-application-form-input-text" value=""></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="a1a1a1a1-0000-4000-8000-000000000001">
      <label class="ashby-application-form-question-title" for="a1a1a1a1-0000-4000-8000-000000000001">Phone Number</label>
      <div><input name="a1a1a1a1-0000-4000-8000-000000000001" required id="a1a1a1a1-0000-4000-8000-000000000001" type="tel" value=""></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="_systemfield_resume">
      <label class="ashby-application-form-question-title" for="_systemfield_resume">Resume</label>
      <div class="ashby-application-form-input-file"><input id="_systemfield_resume" type="file" required><button type="submit">Upload File</button></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="a1a1a1a1-0000-4000-8000-000000000002">
      <label class="ashby-application-form-question-title" for="a1a1a1a1-0000-4000-8000-000000000002">LinkedIn</label>
      <div><input name="a1a1a1a1-0000-4000-8000-000000000002" required id="a1a1a1a1-0000-4000-8000-000000000002" type="text" value=""></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="a1a1a1a1-0000-4000-8000-000000000003">
      <label class="ashby-application-form-question-title" for="a1a1a1a1-0000-4000-8000-000000000003">Current Location</label>
      <div><input class="ashby-application-form-input-autocomplete" placeholder="Start typing..." aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" role="combobox" value=""
        data-places='["Springfield, Illinois, United States","Springfield, Missouri, United States","Example City, California, United States"]'><button type="submit" aria-label="Open"></button></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="a1a1a1a1-0000-4000-8000-000000000004">
      <label class="ashby-application-form-question-title" for="a1a1a1a1-0000-4000-8000-000000000004">Are you able to work in the office 4 days a week?</label>
      <div class="ashby-application-form-question-description"><p>This role is based on-site.</p></div>
      <div class="ashby-application-form-input-yesno"><button type="submit" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button type="submit" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="a1a1a1a1-0000-4000-8000-000000000004"></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="a1a1a1a1-0000-4000-8000-000000000005">
      <label class="ashby-application-form-question-title" for="a1a1a1a1-0000-4000-8000-000000000005">Are you legally authorized to work in the country in which the job you are applying for is located?</label>
      <div class="ashby-application-form-input-yesno"><button type="submit" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button type="submit" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" tabindex="-1" name="a1a1a1a1-0000-4000-8000-000000000005"></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="a1a1a1a1-0000-4000-8000-000000000006">
      <label class="ashby-application-form-question-title" for="a1a1a1a1-0000-4000-8000-000000000006">Will you now or in the future require Acme to sponsor an immigration case?</label>
      <div><textarea name="a1a1a1a1-0000-4000-8000-000000000006" id="a1a1a1a1-0000-4000-8000-000000000006" required></textarea></div>
    </div>
    <div class="ashby-application-form-field-entry" data-field-path="a1a1a1a1-0000-4000-8000-000000000007">
      <label class="ashby-application-form-question-title" for="a1a1a1a1-0000-4000-8000-000000000007">Why do you want to work at Acme?</label>
      <div><textarea name="a1a1a1a1-0000-4000-8000-000000000007" id="a1a1a1a1-0000-4000-8000-000000000007"></textarea></div>
    </div>

  </div>
  <!-- Live: the equal-opportunity survey is its own container, and its blocks lack the field-entry class. -->
  <div class="ashby-survey-form-container"><div class="ashby-application-form-container"><div class="ashby-application-form-section-container">
    <h3>U.S. Equal Opportunity Employment Information</h3>
    <div data-field-path="_systemfield_eeoc_gender">
      <fieldset class="ashby-application-form-input-radio-group"><label class="ashby-application-form-question-title" for="_systemfield_eeoc_gender">Gender</label>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__gender-0" name="eeo__systemfield_eeoc_gender"><label for="eeo__gender-0">Male</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__gender-1" name="eeo__systemfield_eeoc_gender"><label for="eeo__gender-1">Female</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__gender-2" name="eeo__systemfield_eeoc_gender"><label for="eeo__gender-2">Decline to self-identify</label></div>
      </fieldset>
    </div>
    <div data-field-path="_systemfield_eeoc_race">
      <fieldset class="ashby-application-form-input-radio-group"><label class="ashby-application-form-question-title" for="_systemfield_eeoc_race">Race</label>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__race-0" name="eeo__systemfield_eeoc_race"><label for="eeo__race-0">Hispanic or Latino</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__race-1" name="eeo__systemfield_eeoc_race"><label for="eeo__race-1">White (Not Hispanic or Latino)</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__race-2" name="eeo__systemfield_eeoc_race"><label for="eeo__race-2">Black or African American (Not Hispanic or Latino)</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__race-3" name="eeo__systemfield_eeoc_race"><label for="eeo__race-3">Asian (Not Hispanic or Latino)</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__race-4" name="eeo__systemfield_eeoc_race"><label for="eeo__race-4">Two or More Races (Not Hispanic or Latino)</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__race-5" name="eeo__systemfield_eeoc_race"><label for="eeo__race-5">Decline to self-identify</label></div>
      </fieldset>
    </div>
    <div data-field-path="_systemfield_eeoc_veteran_status">
      <fieldset class="ashby-application-form-input-radio-group"><label class="ashby-application-form-question-title" for="_systemfield_eeoc_veteran_status">Veteran Status</label>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__vet-0" name="eeo__systemfield_eeoc_veteran_status"><label for="eeo__vet-0">I identify as one or more of the classifications of protected veteran</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__vet-1" name="eeo__systemfield_eeoc_veteran_status"><label for="eeo__vet-1">I am not a protected veteran</label></div>
        <div class="ashby-application-form-input-radio-group-option"><input type="radio" id="eeo__vet-2" name="eeo__systemfield_eeoc_veteran_status"><label for="eeo__vet-2">I decline to self-identify for protected veteran status</label></div>
      </fieldset>
    </div>

    </div></div></div>
  <div class="ashby-application-form-container">
    <textarea id="g-recaptcha-response-100000" name="g-recaptcha-response" class="grecaptcha-badge" style="display:none"></textarea>
    <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
  </div>
</main>
<script type="module">
  import { install } from '/ashby-like.js';
  install(document);
</script>
</body>
</html>
